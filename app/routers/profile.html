{% extends "base.html" %}

{% block content %}

<div class="container" style="max-width:700px">

  <div class="card shadow-sm border-0">

    <div class="card-body p-4">

      <div class="d-flex align-items-center gap-3 mb-4">

        <div style="
          width:70px;
          height:70px;
          border-radius:50%;
          background:#f4e7e4;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:2rem;
        ">
          👤
        </div>

        <div>
          <h3 class="mb-1">{{ user.username }}</h3>

          <div class="text-muted">
            {% if user.is_admin %}
              مدير النظام
            {% else %}
              مستخدم
            {% endif %}
          </div>
        </div>

      </div>

      <hr>

      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label text-muted">اسم المستخدم</label>
          <div class="form-control">
            {{ user.username }}
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label text-muted">الصلاحية</label>
          <div class="form-control">
            {% if user.is_admin %}
              Admin
            {% else %}
              User
            {% endif %}
          </div>
        </div>

      </div>

      <div class="mt-4 d-flex gap-2">

        <a href="/change-password"
           class="btn btn-primary">

          🔐 تغيير الباسورد

        </a>

        <a href="/logout"
           class="btn btn-outline-danger">

          🚪 تسجيل خروج

        </a>

      </div>

    </div>

  </div>

</div>

{% endblock %}
