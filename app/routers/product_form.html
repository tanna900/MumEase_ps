{% extends "base.html" %}
{% block content %}

<style>

.product-form-shell{
  max-width:1200px;
  margin:auto;
}

.page-title{
  font-size:1.9rem;
  font-weight:900;
}

.page-subtitle{
  color:#6c757d;
  margin-top:4px;
}

.section-card{
  background:#fff;
  border:1px solid #eee;
  border-radius:22px;
  padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.section-title{
  font-size:1.1rem;
  font-weight:800;
  margin-bottom:18px;
}

.form-label{
  font-weight:700;
}

.form-control{
  border-radius:14px !important;
  min-height:50px;
}

.form-control:focus{
  border-color:#93c5fd;
  box-shadow:0 0 0 .2rem rgba(59,130,246,.15);
}

.price-input{
  font-weight:700;
}

.stock-low{
  border-color:#fca5a5 !important;
  background:#fef2f2 !important;
}

.action-buttons .btn{
  min-height:52px;
  border-radius:16px;
  font-weight:800;
  padding-inline:24px;
}

@media(max-width:768px){

  .product-form-shell{
    padding:0 8px;
  }

  .page-title{
    font-size:1.45rem;
  }

  .section-card{
    padding:16px;
    border-radius:18px;
  }

  .action-buttons{
    flex-direction:column;
  }

  .action-buttons .btn{
    width:100%;
  }

}
</style>



<div class="product-form-shell">

<div class="mb-4">

<h4 class="page-title">

  {% if product %}✏️ تعديل صنف{% else %}➕ إضافة صنف جديد{% endif %}
</h4>

<div class="page-subtitle">
  {% if product %}
    تحديث بيانات المنتج والمخزون والأسعار
  {% else %}
    إضافة منتج جديد للنظام وإدارة بياناته
  {% endif %}
</div>

</div>



<form method="post" action="{% if product %}/products/update/{{product.id}}{% else %}/products/create{% endif %}">

<div class="section-card mb-4">

<div class="section-title">
  📦 معلومات المنتج
</div>

  <div class="row g-3">
    <div class="col-lg-4 col-md-6">
      <label class="form-label">اسم المنتج</label>
      <input name="name" class="form-control" required value="{{ product.name if product else '' }}">
    </div>
    <div class="col-lg-2 col-md-6">
      <label class="form-label">اللون</label>
      <input name="color" class="form-control" value="{{ product.color if product else '' }}">
    </div>
    <div class="col-lg-2 col-md-6">
      <label class="form-label">المقاس</label>
      <input name="size" class="form-control" value="{{ product.size if product else '' }}">
    </div>
    <div class="col-lg-4 col-md-6">
      <label class="form-label">الباركود</label>
      <input name="barcode" class="form-control" value="{{ product.barcode if product else '' }}">
    </div>
    <div class="col-lg-3 col-md-6">
      <label class="form-label">سعر التكلفة</label>
      <input type="number" step="0.01" name="cost_price" class="form-control price-input" value="{{ product.cost_price if product else 0 }}">
    </div>
    <div class="col-lg-3 col-md-6">
      <label class="form-label">سعر البيع</label>
      <input type="number" step="0.01" name="price" class="form-control price-input" required value="{{ product.price if product else '' }}">
    </div>
    <div class="col-lg-3 col-md-6">
      <label class="form-label">المخزون</label>
      <input type="number" name="stock" class="form-control {% if product and (product.stock or 0) < 4 %}stock-low{% endif %}" value="{{ product.stock if product else 0 }}">
    
</div>
</div>

<div class="mt-4 d-flex gap-3 action-buttons">

    <button class="btn btn-success">💾 حفظ المنتج</button>
    <a href="/products" class="btn btn-outline-secondary">⬅️ رجوع للمنتجات</a>
  </div>
</form>


</form>
</div>
{% endblock %}
