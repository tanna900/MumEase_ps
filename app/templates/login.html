<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — MumEase POS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background: #f0f2f5; }
    .login-card {
      max-width: 420px;
      margin: 100px auto;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
    .login-header {
      background: linear-gradient(135deg, #6c47ff, #a259f7);
      border-radius: 16px 16px 0 0;
      padding: 32px;
      text-align: center;
      color: white;
    }
    .login-header h2 { font-weight: 900; margin: 0; }
    .login-header p { opacity: 0.85; margin: 4px 0 0; }
  </style>
</head>
<body>
  <div class="login-card card border-0">
    <div class="login-header">
      <h2>👗 MumEase POS</h2>
      <p>نظام نقاط البيع</p>
    </div>
    <div class="card-body p-4">
      {% if msg %}
      <div class="alert alert-danger py-2">{{ msg }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label fw-semibold">اسم المستخدم</label>
          <input type="text" name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">الباسورد</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">دخول</button>
      </form>
    </div>
  </div>
</body>
</html>
