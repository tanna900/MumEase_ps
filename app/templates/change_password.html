{% extends "base.html" %}
{% block content %}

<style>

.password-shell{
  max-width:560px;
  margin:auto;
}

.page-card{
  background:#fff;
  border:1px solid #eee;
  border-radius:24px;
  padding:22px;
  box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.page-title{
  font-size:1.7rem;
  font-weight:800;
}

.page-subtitle{
  color:#6c757d;
  margin-top:4px;
}

.form-control{
  border-radius:14px !important;
  min-height:50px;
  padding-inline-end:48px;
}

.form-label{
  font-weight:700;
}

.password-wrap{
  position:relative;
}

.toggle-pass{
  position:absolute;
  top:50%;
  inset-inline-end:12px;
  transform:translateY(-50%);
  border:none;
  background:none;
  color:#6c757d;
  cursor:pointer;
}

.save-btn{
  min-height:54px;
  border-radius:16px;
  font-size:1.05rem;
  font-weight:800;
}

.alert{
  border-radius:16px;
}

.helper-text{
  font-size:.82rem;
  color:#6c757d;
}

@media(max-width:768px){

  .password-shell{
    padding:0 8px;
  }

  .page-card{
    padding:18px;
    border-radius:20px;
  }

  .page-title{
    font-size:1.4rem;
  }

}
</style>

<div class="password-shell py-4">
  
<div class="mb-4">

  <div class="page-title">
    🔑 تغيير الباسورد
  </div>

  <div class="page-subtitle">
    تحديث كلمة المرور الخاصة بحسابك
  </div>

</div>


  {% if msg %}
  <div class="alert {{ 'alert-success' if '✅' in msg else 'alert-danger' }} rounded-4">{{ msg }}</div>
  {% endif %}

  <div class="page-card">
    
      <form method="post" action="/change-password">
        <div class="mb-3">
          <label class="form-label fw-semibold">الباسورد الحالي</label>
          
<div class="password-wrap">

<input type="password"
       name="old_password"
       class="form-control"
       id="oldPass"
       required>

<button type="button"
        class="toggle-pass"
        onclick="togglePassword('oldPass', this)">
  👁️
</button>

</div>

        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">الباسورد الجديد</label>
          
<div class="password-wrap">

<input type="password"
       name="new_password"
       class="form-control"
       id="newPass"
       required
       minlength="6">

<button type="button"
        class="toggle-pass"
        onclick="togglePassword('newPass', this)">
  👁️
</button>

</div>

          <div class="helper-text mt-2">يجب أن تحتوي كلمة المرور على 6 حروف على الأقل</div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">تأكيد الباسورد الجديد</label>
          
<div class="password-wrap">

<input type="password"
       name="confirm_password"
       class="form-control"
       id="confirmPass"
       required>

<button type="button"
        class="toggle-pass"
        onclick="togglePassword('confirmPass', this)">
  👁️
</button>

</div>

        </div>
        <button type="submit" class="btn btn-primary w-100 save-btn">💾 حفظ الباسورد الجديد</button>
      </form>
    
  </div>
</div>

<script>
function togglePassword(id, btn){
  const input = document.getElementById(id);

  if(input.type === 'password'){
    input.type = 'text';
    btn.innerHTML = '🙈';
  }else{
    input.type = 'password';
    btn.innerHTML = '👁️';
  }
}
</script>

{% endblock %}
