{% extends "base.html" %}
{% block content %}
<div class="container py-4" style="max-width:500px;">
  <h4 class="fw-bold mb-4">🔑 تغيير الباسورد</h4>

  {% if msg %}
  <div class="alert {{ 'alert-success' if '✅' in msg else 'alert-danger' }}">{{ msg }}</div>
  {% endif %}

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" action="/change-password">
        <div class="mb-3">
          <label class="form-label fw-semibold">الباسورد الحالي</label>
          <input type="password" name="old_password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">الباسورد الجديد</label>
          <input type="password" name="new_password" class="form-control" required minlength="6">
          <div class="form-text">6 حروف على الأقل</div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">تأكيد الباسورد الجديد</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">حفظ الباسورد الجديد</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
